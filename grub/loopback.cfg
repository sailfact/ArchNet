search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

default=fwos
timeout=3
timeout_style=menu

menuentry 'fwOS (x86_64, loopback)' --id 'fwos' {
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" console=tty0 console=ttyS0,115200n8 net.ifnames=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry 'fwOS recovery shell (x86_64, loopback)' --id 'fwos-recovery' {
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" console=tty0 console=ttyS0,115200n8 net.ifnames=0 systemd.unit=rescue.target
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

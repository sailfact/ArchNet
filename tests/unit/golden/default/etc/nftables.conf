#!/usr/bin/nft -f
# Generated by the fwOS config engine from /etc/project/config.yaml (schema v1).
# Do not edit; changes will be overwritten. Edit the config and run `fwctl apply`.

flush ruleset

define lan_if = "eth1"
define wan_if = "eth0"

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        ct state invalid drop
        ct state established,related accept
        iifname "lo" accept
        iifname $lan_if accept comment "lan-to-firewall"
        iifname $wan_if udp sport 67 udp dport 68 accept comment "WAN DHCP client lease traffic"
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state invalid drop
        ct state established,related accept
        iifname $lan_if oifname $wan_if accept comment "lan-to-wan"
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        ip saddr 10.10.10.0/24 oifname $wan_if masquerade
    }
}

#!/usr/bin/nft -f
# fwOS Phase 2 static default policy; the Phase 3 config engine replaces
# this file with rendered output. Do not hand-edit on a running system.

flush ruleset

define wan_if = "eth0"
define lan_if = "eth1"

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        ct state invalid drop
        ct state established,related accept
        iifname "lo" accept
        iifname $lan_if accept
        iifname $wan_if udp sport 67 udp dport 68 accept comment "WAN DHCP client lease traffic"
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state invalid drop
        ct state established,related accept
        iifname $lan_if oifname $wan_if accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname $wan_if masquerade
    }
}

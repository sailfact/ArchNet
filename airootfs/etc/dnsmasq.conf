# fwOS Phase 2 static default DHCP/DNS; the Phase 3 config engine replaces
# this file with rendered output. Do not hand-edit on a running system.
interface=eth1
bind-dynamic
domain-needed
bogus-priv
resolv-file=/run/systemd/resolve/resolv.conf
domain=lan
local=/lan/
address=/fwos.lan/10.10.10.1
dhcp-range=10.10.10.100,10.10.10.200,12h
dhcp-option=option:router,10.10.10.1
dhcp-option=option:dns-server,10.10.10.1
dhcp-authoritative
